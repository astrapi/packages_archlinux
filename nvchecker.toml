# Upstream-Versions-Check fuer PKGBUILDs ohne eigenen Update-Mechanismus.
#
# Nicht enthalten und bewusst nicht noetig:
# - astrapi-gnome, astrapi-sync-cli: tracken sich selbst ueber pkgver() +
#   git describe gegen den eigenen main-HEAD, kein externer Upstream.
# - epsonscan2, ungoogled-chromium-bin: existieren unter demselben Namen
#   auf AUR -- der bestehende Update-Check im astrapi-packages-Server
#   fragt AUR-RPC bereits ungefiltert fuer jeden Paketnamen ab und erkennt
#   Veraltung dort schon automatisch.
#
# nvchecker meldet nur "es gibt Version X" -- das Anpassen der PKGBUILD
# selbst (pkgver ersetzen, pkgrel zuruecksetzen) macht ein separates Skript.

[spice-gtk]
source = "gitlab"
gitlab = "spice/spice-gtk"
host = "gitlab.freedesktop.org"
use_max_tag = true
prefix = "v"

[openscad-appimage]
source = "regex"
url = "https://files.openscad.org/snapshots/"
regex = "OpenSCAD-([0-9]{4}\\.[0-9]{2}\\.[0-9]{2})-x86_64\\.AppImage"

[eizoctl]
source = "gitea"
gitea = "p/usb-drivers"
host = "git.janouch.name"
use_max_tag = true
prefix = "v"
