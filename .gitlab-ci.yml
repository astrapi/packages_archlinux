update-index:
  image: python:3.12-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "*/PKGBUILD"
      when: always
    - when: never
  script:
    - python3 build_index.py
    - |
      if git diff --quiet packages.json; then
        echo "Keine Änderungen in packages.json."
        exit 0
      fi
      git config user.email "ci@gitlab.com"
      git config user.name "GitLab CI"
      git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      git add packages.json
      git commit -m "chore: packages.json aktualisiert [skip ci]"
      git push origin HEAD:${CI_DEFAULT_BRANCH}
